name: Bug report
description: Report reproducible incorrect behaviour, a crash, or a display problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. English and French are both welcome.
        Please search existing issues first and do not include account details or other personal data.

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the Appstore or release filename.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Watch or emulator platform
      options:
        - Pebble Classic / Steel (aplite)
        - Pebble Time / Time Steel (basalt)
        - Pebble Time Round (chalk)
        - Pebble 2 (diorite)
        - Pebble Time 2 (emery)
        - Pebble 2 Duo (flint)
        - Pebble Round 2 (gabbro)
        - Other / unknown
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - Français
    validations:
      required: true

  - type: input
    id: settings
    attributes:
      label: Timer settings
      description: Include interval, start delay and whether numbered haptics are enabled.
      placeholder: Interval 5 s; delay 10 s; numbered haptics enabled
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tick Every
        2. Set …
        3. Press …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant logs
      description: Drag screenshots here or paste the useful `pebble logs` lines. Remove personal data first.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I removed account details and other personal data from attachments.
          required: true
